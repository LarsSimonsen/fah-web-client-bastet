<!doctype html><meta charset=utf-8>
<link rel=stylesheet href="css/font-awesome.min.css">
<style>
html,body{margin:0}
body{font:15px/1.2 "Segoe UI",Raleway,sans-serif;padding:16px;display:inline-block}
table{border-collapse:collapse}
th,td{padding:7px 14px;text-align:center}
th{font-weight:600}
th.group{font-size:13px;letter-spacing:.04em;text-transform:uppercase}
td.state{text-align:left;white-space:nowrap}
td.changed{font-weight:700}
.ic{font-size:20px;width:1.6em;display:inline-block}
td.b{border-left:3px solid var(--page)}
tr.sep td{padding:2px;background:var(--page)}
.fa.wait-badge{position:relative}
.fa.wait-badge::after{content:'\f017';position:absolute;right:-0.55em;bottom:-0.35em;font-size:0.6em}
caption{caption-side:top;text-align:left;font-weight:700;padding:0 0 8px 2px}
</style>
<table><caption id=cap></caption>
<thead>
<tr><th rowspan=2>State</th><th colspan=2 class=group>Before</th><th colspan=2 class=group>After</th></tr>
<tr><th>Color</th><th>Greyscale</th><th>Color</th><th>Greyscale</th></tr>
</thead><tbody id=rows></tbody></table>
<script>
const dark = location.hash == '#dark';
const T = dark ?
  {page:'#0b121d', fg:'#ffffff', head:'#2a3d4f', headfg:'#f1f1f1', rows:['#0f1319','#1a2835'],
   before:{run:'#008000',finish:'#00cc99',pause:'#ffa500',credited:'#ffd700',wait:'#b51100'},
   after: {run:'#4caf50',finish:'#00cc99',pause:'#ffa500',credited:'#ffd700',wait:'#ff6b5b'}} :
  {page:'#e7e7e7', fg:'#333333', head:'#dedede', headfg:'#333333', rows:['#ffffff','#f3f3f3'],
   before:{run:'#008000',finish:'#00cc99',pause:'#ffa500',credited:'#ffd700',wait:'#b51100'},
   after: {run:'#008000',finish:'#007a62',pause:'#a65300',credited:'#7d6300',wait:'#b51100'}};
cap.textContent = dark ? 'Dark theme' : 'Light theme';
document.documentElement.style.setProperty('--page', T.page);
document.body.style.background = T.page; document.body.style.color = T.headfg;
document.querySelectorAll('th').forEach(th => {th.style.background = T.head; th.style.color = T.headfg});

// Grey with the same WCAG relative luminance as the given color
const lin = v => v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
const enc = v => v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055;
function grey(hex) {
  const [r, g, b] = [1, 3, 5].map(i => lin(parseInt(hex.substr(i, 2), 16) / 255));
  const y = Math.round(255 * enc(0.2126 * r + 0.7152 * g + 0.0722 * b));
  return `rgb(${y},${y},${y})`;
}

// [label, state or '' for default color, before icon, after icon]
const R = [
  ['Downloading', '',         'download',    'download'],
  ['Running',     'run',      'refresh',     'refresh'],
  ['Finishing',   'finish',   'refresh',     'flag-checkered'],
  ['Uploading',   '',         'upload',      'upload'],
  ['Paused',      'pause',    'hourglass-o', 'hourglass-o'],
  ['Credited',    'credited', 'star',        'star'],
  null,
  ['Assign Wait',   'wait', 'clock-o', 'clock-o'],
  ['Download Wait', 'wait', 'clock-o', 'cloud-download wait-badge'],
  ['Core Wait',     'wait', 'clock-o', 'cogs wait-badge'],
  ['Run Wait',      'wait', 'clock-o', 'refresh wait-badge'],
  ['Upload Wait',   'wait', 'clock-o', 'cloud-upload wait-badge'],
  ['Dump Wait',     'wait', 'clock-o', 'trash-o wait-badge'],
];
const cell = (icon, color, bg, cls='') =>
  `<td class="${cls}" style="background:${bg}"><span class=ic style="color:${color}"><span class="fa fa-${icon}"></span></span></td>`;
let n = 0;
rows.innerHTML = R.map(r => {
  if (!r) return '<tr class=sep><td colspan=5></td></tr>';
  const [label, st, bi, ai] = r, bg = T.rows[n++ % 2];
  const bc = st ? T.before[st] : T.fg, ac = st ? T.after[st] : T.fg;
  const changed = bi != ai || bc != ac;
  return `<tr><td class="state${changed ? ' changed' : ''}" style="background:${bg};color:${T.fg}">${label}</td>` +
    cell(bi, bc, bg, 'b') + cell(bi, grey(bc), grey(bg)) +
    cell(ai, ac, bg, 'b') + cell(ai, grey(ac), grey(bg)) + '</tr>';
}).join('');
</script>
